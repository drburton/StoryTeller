name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Supported Godot version. Update together with project.godot (docs/decisions/0003).
  GODOT_VERSION: 4.7.2-stable

jobs:
  test-linux:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-linux-${{ env.GODOT_VERSION }}

      - name: Install Godot
        run: echo "GODOT_BIN=$(tools/ci_install_godot.sh "$GODOT_VERSION" ~/godot)" >> "$GITHUB_ENV"

      - name: Run tests
        run: tools/run_tests.sh

      - name: Check exported game
        run: tools/check_export.sh

      - name: Check the plugin installs in an empty project
        run: tools/check_addon_install.sh

  csharp:
    name: TaleScript C# core
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Treat warnings as errors so the core stays clean for Unity.
      - name: Build
        run: dotnet build csharp/TaleScript.sln -warnaserror

      # The same conformance suite the Godot reference passes (decision 0025).
      - name: Run the conformance suite
        run: dotnet run --no-build --project csharp/TaleScript.Conformance -- conformance

      # A clean tale passes, and a tale with problems fails.
      - name: Check the command-line checker
        run: |
          check="dotnet run --no-build --project csharp/TaleScript.Check --"
          $check --strict --context=conformance/check/full_sample_is_clean.context.json conformance/check/full_sample_is_clean.tale
          if $check conformance/check/unknown_names.tale; then echo "expected a failure"; exit 1; fi

  test-windows:
    name: Tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: ~\godot
          key: godot-windows-${{ env.GODOT_VERSION }}

      - name: Install Godot
        shell: pwsh
        run: |
          $dir = Join-Path $HOME "godot"
          if (-not (Get-ChildItem $dir -Filter "*_console.exe" -ErrorAction SilentlyContinue)) {
            New-Item -ItemType Directory -Force $dir | Out-Null
            $url = "https://github.com/godotengine/godot-builds/releases/download/$env:GODOT_VERSION/Godot_v$($env:GODOT_VERSION)_win64.exe.zip"
            Invoke-WebRequest $url -OutFile "$dir\godot.zip"
            Expand-Archive "$dir\godot.zip" -DestinationPath $dir -Force
            Remove-Item "$dir\godot.zip"
          }
          "GODOT_BIN=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run tests
        shell: pwsh
        run: .\tools\run_tests.ps1

      - name: Cache export templates
        uses: actions/cache@v4
        with:
          path: ~/AppData/Roaming/Godot/export_templates
          key: godot-templates-windows-${{ env.GODOT_VERSION }}

      - name: Install the Windows export templates
        shell: pwsh
        run: |
          $dir = Join-Path $env:APPDATA "Godot\export_templates\$($env:GODOT_VERSION -replace '-', '.')"
          if (-not (Test-Path (Join-Path $dir "windows_release_x86_64_console.exe"))) {
            New-Item -ItemType Directory -Force $dir | Out-Null
            $ProgressPreference = "SilentlyContinue"
            $url = "https://github.com/godotengine/godot-builds/releases/download/$env:GODOT_VERSION/Godot_v$($env:GODOT_VERSION)_export_templates.tpz"
            Invoke-WebRequest $url -OutFile templates.tpz
            # Windows' own tar reads zip files.
            & "$env:SystemRoot\System32\tar.exe" -xf templates.tpz -C $dir --strip-components=1 `
              templates/version.txt templates/windows_release_x86_64.exe templates/windows_release_x86_64_console.exe
            Remove-Item templates.tpz
          }
          Get-ChildItem $dir

      - name: Check the demo exported as a Windows game
        shell: pwsh
        run: .\tools\check_windows_export.ps1

  test-beta:
    # Early warning for the next Godot release. Set the repository variable
    # GODOT_BETA (for example 4.8-beta1) to enable; failures do not block merges.
    name: Tests (Godot beta)
    if: ${{ vars.GODOT_BETA != '' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: echo "GODOT_BIN=$(tools/ci_install_godot.sh "${{ vars.GODOT_BETA }}" ~/godot)" >> "$GITHUB_ENV"

      - name: Run tests
        run: tools/run_tests.sh
