name: Studio

# Builds Visual Novel StoryTeller Studio for tablets: the block editor, with
# the tablet check (studio/check/, M8 step S0) in its ⋯ menu. The Android
# build is kept as a workflow artifact: download it from the run's Summary
# page and install it on an Android tablet. The iOS build follows once an
# Apple developer account is set up (docs/studio-design.md §9). It also
# checks that a story file from the Studio opens in the plugin, plays, and
# exports as a web game (decision 0022).

on:
  push:
    branches: [main]
    paths: ["studio/**", "addons/**", "examples/**", "project.godot", "tools/build_studio.sh", "tools/check_studio_story.sh", "tools/studio_story/**", "tools/addon_install/**", ".github/workflows/studio.yml"]
  pull_request:
    paths: ["studio/**", "addons/**", "examples/**", "project.godot", "tools/build_studio.sh", "tools/check_studio_story.sh", "tools/studio_story/**", "tools/addon_install/**", ".github/workflows/studio.yml"]
  workflow_dispatch:

env:
  # Supported Godot version. Keep in step with ci.yml.
  GODOT_VERSION: 4.7.2-stable

jobs:
  android:
    name: Studio for Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-linux-${{ env.GODOT_VERSION }}

      - name: Install Godot
        run: echo "GODOT_BIN=$(tools/ci_install_godot.sh "$GODOT_VERSION" ~/godot)" >> "$GITHUB_ENV"

      - name: Cache export templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-android-web-${{ env.GODOT_VERSION }}

      - name: Install the Android and web export templates
        run: |
          dir=~/.local/share/godot/export_templates/${GODOT_VERSION/-/.}
          if [[ ! -f "$dir/android_debug.apk" || ! -f "$dir/web_nothreads_release.zip" ]]; then
            mkdir -p "$dir"
            curl -fsSL --retry 3 -o templates.tpz \
              "https://github.com/godotengine/godot-builds/releases/download/$GODOT_VERSION/Godot_v${GODOT_VERSION}_export_templates.tpz"
            unzip -q -j templates.tpz templates/version.txt templates/android_debug.apk templates/android_release.apk \
              templates/web_nothreads_release.zip -d "$dir"
            rm templates.tpz
          fi
          ls "$dir"

      - name: Check a Studio story opens in the plugin, plays, and exports for the web
        run: tools/check_studio_story.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Point Godot at the Android SDK and a debug key
        run: |
          keytool -genkeypair -v -keystore ~/debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.7.tres <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Build the Android app
        run: tools/build_studio.sh android build/storyteller-studio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: storyteller-studio-android
          path: build/storyteller-studio.apk
